# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "site reliability engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "infrastructure engineer"
    tier: 2
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "integration engineer"
    tier: 3
  - query: "ML engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "AI engineer"
    tier: 3
  - query: "security engineer"
    tier: 3

# Locations to search
locations:
  - location: "San Francisco, CA"
    remote: false
  - location: "Remote"
    remote: true

# Location filtering -- accept/reject patterns for job location text
location:
  accept_patterns:
    - "San Francisco"
    - "Bay Area"
    - "SF"
    - "California"
    - "CA"
    - "Remote"
    - "Anywhere"
    - "United States"
    - "US"
    - "USA"
  reject_patterns:
    - "New York only"
    - "Seattle only"
    - "onsite only"
    - "London, UK"
    - "India"
    - "Philippines"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "USA"

# JobSpy source boards (all available options shown)
boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "director"
  - "managing director"
  - "VP "
  - "vice president"
  - "svp"
  - "avp"
  - "chief"
  - "head of"
  - "intern"
  - "internship"
  - "co-op"
  - "trainee"
  - "graduate trainee"
  - "campus"
  - "fellowship"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
  - "recruiter"
  - "talent acquisition"
  - "sales executive"
  - "telecaller"
  - "bpo executive"
  - "customer support"
  - "accountant"

# Target company filtering -- prioritize top product companies & startups; reject IT services/consulting/staffing
company_filter:
  enabled: true
  only_product_companies: true
  min_company_size: 50

  # Hard-block company names (case-insensitive match)
  blocked_companies:
    # Top IT Services & Outsourcing
    - "TCS"
    - "Tata Consultancy Services"
    - "Infosys"
    - "Wipro"
    - "Cognizant"
    - "Accenture"
    - "HCL Technologies"
    - "HCLTech"
    - "Capgemini"
    - "Tech Mahindra"
    - "LTIMindtree"
    - "Mindtree"
    - "Hexaware"
    - "Mphasis"
    - "Birlasoft"
    - "Coforge"
    - "Zensar"
    - "UST Global"
    - "Virtusa"
    - "EPAM"
    - "DXC"
    - "DXC Technology"
    - "Atos"
    - "CGI"
    - "NTT Data"
    - "Syntel"
    - "iGate"
    # Contract Staffing & Body Shops (reputable tech search firms like Randstad & Michael Page are permitted)
    - "TeamLease"
    - "Quess Corp"
    - "Allegis"
    - "TEKsystems"
    - "Aerotek"
    - "Robert Half"
    - "Kforce"
    - "ManpowerGroup"
    - "Experis"
    - "Hays"
    - "Collabera"
    - "Apex Systems"
    - "Insight Global"
    - "SynergisticIT"
    - "Diverse Lynx"
    - "Compunnel"
    # BPO & KPO
    - "Teleperformance"
    - "Concentrix"
    - "Genpact"
    - "WNS"
    - "EXL Service"
    - "Sutherland"
    - "Hinduja Global Solutions"
    - "Startek"
    # Big 4 & Management Consulting
    - "Deloitte"
    - "PwC"
    - "PricewaterhouseCoopers"
    - "EY"
    - "Ernst & Young"
    - "KPMG"
    - "McKinsey"
    - "BCG"
    - "Bain"
    # Government & PSU
    - "NIC"
    - "CDAC"
    - "DRDO"
    - "ISRO"
    - "BEL"
    - "BHEL"
    - "State Bank of India"
    - "SBI"

  # Reject jobs with staffing / body-shopping / C2C phrases in description
  blocked_description_keywords:
    - "c2c"
    - "corp-to-corp"
    - "third-party payroll"
    - "third party payroll"
    - "on the payroll of"
    - "client location"
    - "our direct client"
    - "our prime vendor"
    - "staffing firm"
    - "staffing agency"
    - "recruitment agency"
    - "contract to hire"
    - "body shopping"
    - "subcontracting"

  # Preferred product domains (for LLM score weighting)
  preferred_domains:
    - "SaaS"
    - "Cloud"
    - "Developer Tools"
    - "Fintech"
    - "AI / ML"
    - "Healthtech"
    - "E-commerce"
    - "Edtech"
    - "Cybersecurity"

