# Direct career site registry for ApplyPilot (India & Global Remote Tech)
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Instahyre": "https://www.instahyre.com"
  "Wellfound India": "https://wellfound.com"
  "Cutshort": "https://cutshort.io"
  "Hasjob": "https://hasjob.co"
  "Cuvette": "https://cuvette.tech"
  "Foundit India": "https://www.foundit.in"
  "SimplyHired India": "https://www.simplyhired.co.in"
  "Amazon Jobs (India)": "https://amazon.jobs"
  "Startup.jobs": "https://startup.jobs"
  "Hacker News Jobs": "https://news.ycombinator.com/"
  "WeWorkRemotely": "https://weworkremotely.com"
  "RemoteOK": null
  "Remotive": null
  "Himalayas": "https://himalayas.app"
  "Arc.dev": "https://arc.dev"
  "BuiltIn Remote": "https://builtin.com"
  "Randstad India": "https://www.randstad.in"
  "Michael Page India": "https://www.michaelpage.co.in"
  "Techstars Jobs": "https://jobs.techstars.com"
  "TopStartups": "https://topstartups.io"
  "4DayWeek": "https://4dayweek.io"

sites:
  # ── Searchable sites (URL includes query + location params) ──────────
  # India & Remote tech search
  - name: "Randstad India"
    url: "https://www.randstad.in/jobs/q-{query_encoded}/"
    type: search

  - name: "Michael Page India"
    url: "https://www.michaelpage.co.in/jobs/{query_encoded}"
    type: search

  - name: "Foundit India"
    url: "https://www.foundit.in/srp/results?query={query_encoded}&locations={location_encoded}"
    type: search

  - name: "SimplyHired India"
    url: "https://www.simplyhired.co.in/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "Startup.jobs"
    url: "https://startup.jobs/?q={query_encoded}&location={location_encoded}"
    type: search

  - name: "Techstars Jobs"
    url: "https://jobs.techstars.com/jobs?keywords={query_encoded}"
    type: search

  - name: "PowerToFly"
    url: "https://powertofly.com/jobs/?keywords={query_encoded}&remote=true"
    type: search

  # ── Static sites (curated tech & product startups) ───────────────────
  # Top India Product & Startup Platforms
  - name: "Wellfound India"
    url: "https://wellfound.com/role/l/software-engineer/india"
    type: static

  - name: "Cutshort"
    url: "https://cutshort.io/jobs"
    type: static

  - name: "Hasjob"
    url: "https://hasjob.co/"
    type: static

  - name: "Cuvette"
    url: "https://cuvette.tech/jobs"
    type: static

  # Global High-Bar Tech & Remote Product Companies
  - name: "Hacker News Jobs"
    url: "https://news.ycombinator.com/jobs"
    type: static

  - name: "WeWorkRemotely"
    url: "https://weworkremotely.com/categories/remote-programming-jobs"
    type: static

  - name: "RemoteOK"
    url: "https://remoteok.com/remote-dev-jobs"
    type: static

  - name: "Remotive"
    url: "https://remotive.com/remote-jobs/software-dev"
    type: static

  - name: "Himalayas"
    url: "https://himalayas.app/jobs/developer"
    type: static

  - name: "Arc.dev"
    url: "https://arc.dev/remote-jobs/developer"
    type: static

  - name: "TopStartups"
    url: "https://topstartups.io/jobs/?job_location=Remote"
    type: static

  - name: "BuiltIn Remote"
    url: "https://builtin.com/jobs/remote/dev-engineering"
    type: static

  - name: "4DayWeek"
    url: "https://4dayweek.io/remote-jobs/software-engineer"
    type: static
